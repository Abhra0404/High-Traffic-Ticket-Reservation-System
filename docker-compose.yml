services:
  postgres:
    image: postgres:17
    container_name: ticket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: ticket-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: